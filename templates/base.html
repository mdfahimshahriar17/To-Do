{%load crispy_forms_tags %} 
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %} TO-Do App {% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <!-- Header Section -->
     <header class="bg-dark text-white p-3">
      <nav class=navbar navbar-expand-lg navbar-dark>
        <div class="container">
          <a class="navbar-brand" href="{% url 'task_list' %}">Home</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              {% if user.is_authenticated %}
                <li class=nav-item>
                  <a href="{% url 'task_create' %}" class="btn btn-primary text-white">Create Task</a>
                </li>
                <li class=nav-item>
                  <a href="{% url 'logout' %}" class="btn btn-danger text-white">Logout</a>
                </li>
              {% else %}
                <li class=nav-item>
                  <a href="{% url 'login' %}" class="btn btn-success text-white">Login</a>
                </li>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav>
     </header>
  
    <!--Main content-->
    <main class="container mt-4 flex-grow-1">
      <!--block content-->
      {% block content %}
      {% endblock %}
    </main>

    <!--Footer section-->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p>&copy; 2026 To-Do App | All Right Reserved</p>
    </footer>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
